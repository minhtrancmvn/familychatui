# HTTP vhost. setup-host.sh runs `certbot --nginx`, which adds the 443 server and certificate lines.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    include /etc/nginx/snippets/cloudflare-realip.conf;

    # Photos are downscaled in the browser, but a message can carry up to 5 attachments.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Never pass a client-supplied CF-Connecting-IP through (the record is DNS-only).
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Replies stream as server-sent events: pass bytes through at once, allow long replies.
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
