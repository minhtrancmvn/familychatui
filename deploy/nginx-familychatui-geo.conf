# Only Vietnam, Singapore and the US (iCloud Private Relay included) may use the chat site.
# $familychat_allowed comes from /etc/nginx/conf.d/familychatui-geo.conf, built by update-geo-allowlist.py.
# setup-host.sh installs this as /etc/nginx/snippets/familychatui-geo.conf and includes it in the HTTPS
# server only, so port 80 keeps serving certificate renewals.
if ($familychat_allowed = 0) { return 403; }

# A short bilingual page instead of nginx's bare "403 Forbidden". Only nginx's own 403s land here; the
# app's 403 answers pass through unchanged (proxy_intercept_errors is off). A named location skips the
# server-level `if` above, so this can't loop.
error_page 403 @familychat_blocked;
location @familychat_blocked {
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    return 403 "<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='robots' content='noindex'><title>Not available here</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font:16px/1.5 system-ui,sans-serif;background:#fff7f2;color:#1d1d22;padding:24px;box-sizing:border-box}main{max-width:26rem}h1{font-size:1.25rem;margin:0 0 .5rem}p{margin:0 0 1.5rem;color:#55555e}@media (prefers-color-scheme:dark){body{background:#131317;color:#f1f1f4}p{color:#a9a9b3}}</style></head><body><main><h1>Trang này chưa mở ở nơi bạn đang ở</h1><p>Nếu bạn là người trong nhà, hãy bật VPN (Singapore) rồi tải lại trang, hoặc nhắn cho người đã cài đặt trang này.</p><h1>Not available where you are</h1><p>If you are family, turn on the VPN (Singapore) and reload the page, or message whoever set up this chat.</p></main></body></html>";
}
